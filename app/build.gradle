apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "es.soutullo.blitter"
    compileSdkVersion 36
    defaultConfig {
        applicationId "es.soutullo.blitter"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 11
        versionName "2.2.1"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        dataBinding true
    }
    applicationVariants.all { variant ->
        variant.resValue "string", "app_version_name", variant.versionName
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"

    implementation 'androidx.core:core:1.18.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.google.android.gms:play-services-vision:17.0.2'
    implementation 'com.google.android.gms:play-services-ads:24.9.0'
    implementation 'com.android.billingclient:billing:9.0.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.github.sevar83:indeterminate-checkbox:1.0.5@aar'
    implementation 'com.github.AppIntro:AppIntro:6.3.1'
    implementation 'com.github.kobakei:MaterialFabSpeedDial:1.1.5'
    implementation('com.github.woxingxiao:BubbleSeekBar:3.20') {
        exclude group: 'com.android.support'
    }
    testImplementation 'junit:junit:4.12'
}

apply plugin: 'kotlin-kapt'

repositories {
    mavenCentral()
}

apply plugin: 'com.google.gms.google-services'
